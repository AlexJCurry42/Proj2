# Render the DuoVision image batch and publish it with the web viewer on GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# The site is https://<owner>.github.io/<repo>/ ; open it in Safari on the phone and use
# Share -> Add to Home Screen for a full-screen launch (see viewer/README.md).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one, a running one finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180       # a first build renders 24 videos (about 70 min); later builds reuse them
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (with the bundled ffmpeg for videos)
        run: python -m pip install ".[video]"

      # The looping videos take about three minutes each to render. They depend only on the
      # engine, so keep them between builds and re-render only when duovision/ changes.
      - name: Restore rendered videos
        uses: actions/cache@v4
        with:
          path: site-videos
          key: videos-${{ hashFiles('duovision/**', 'pyproject.toml') }}

      - name: Render images (full resolution), videos, manifest and viewer
        run: |
          mkdir -p site site-videos
          cp -n site-videos/*.mp4 site/ 2>/dev/null || true
          python -m duovision batch --out site --videos
          cp site/*.mp4 site-videos/

      - name: Check the site
        run: |
          test -f site/index.html
          test -f site/manifest.json
          python - <<'EOF'
          import json, pathlib
          site = pathlib.Path("site")
          m = json.loads((site / "manifest.json").read_text())
          files = [e["file"] for e in m["entries"]]
          missing = [f for f in files if not (site / f).is_file()]
          assert files and not missing, f"{len(files)} entries, missing: {missing[:5]}"
          size = sum(p.stat().st_size for p in site.rglob("*") if p.is_file())
          videos = [f for f in files if f.endswith(".mp4")]
          assert len(videos) == 24, f"expected 24 videos, found {len(videos)}"
          print(f"{len(files) - len(videos)} images, {len(videos)} videos, {size / 1e6:.0f} MB")
          assert size < 950e6, "GitHub Pages sites must stay under 1 GB"
          EOF
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
