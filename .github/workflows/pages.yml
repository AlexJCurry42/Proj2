# Render the DuoVision image batch and publish it with the web viewer on GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# The site is https://<owner>.github.io/<repo>/ ; open it in Safari on the phone and use
# Share -> Add to Home Screen for a full-screen launch (see viewer/README.md).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one, a running one finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install .

      # Moving pictures are drawn live by the viewer (viewer/engine.js) from the scene pack the batch
      # exports, so no videos are rendered here. `batch --videos` still exists for making files.
      - name: Render images (full resolution), scene pack, manifest and viewer
        run: python -m duovision batch --out site

      - name: Check the site
        run: |
          test -f site/index.html
          test -f site/manifest.json
          python - <<'EOF'
          import json, pathlib
          site = pathlib.Path("site")
          m = json.loads((site / "manifest.json").read_text())
          files = [e["file"] for e in m["entries"]]
          missing = [f for f in files if not (site / f).is_file()]
          assert files and not missing, f"{len(files)} entries, missing: {missing[:5]}"
          size = sum(p.stat().st_size for p in site.rglob("*") if p.is_file())
          live = m.get("live") or {}
          assert (site / "engine.js").is_file() and (site / live["pack"]).is_file(), "scene pack missing"
          pack = json.loads((site / live["pack"]).read_text())
          tpl = [s["template"]["file"] for s in pack["scenes"].values() if s["kind"] == "template"]
          assert len(pack["scenes"]) == 8 and all((site / f).is_file() for f in tpl), "scene templates missing"
          print(f"{len(files)} images, {len(pack['scenes'])} live scenes x {len(pack['hinges'])} angles, {size / 1e6:.0f} MB")
          assert size < 950e6, "GitHub Pages sites must stay under 1 GB"
          EOF
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
