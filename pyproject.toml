[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "duovision"
version = "0.1.0"
description = "Fold-aware stereograms for the iPhone Duo's folded inner display"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
duovision = "duovision.cli:main"

[tool.setuptools.packages.find]
include = ["duovision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
